# deps-sweeper: new advisories and major-version gaps reported; patch and minor updates applied in a
# worktree and put up as one pull request. docs/recipes.md.
name = "deps-sweeper"
summary = "Once a week, runs the project's audit and outdated commands and reports each new advisory and each dependency a major behind — or, at propose, applies the patch and minor updates in a worktree, runs the checks, and opens one pull request; a major is never applied, and the same package failing twice is a stop."
needs_tracker = false
levels = ["report", "propose"]
budget_hint_usd = 5

[[job]]
name = "deps-sweeper"
schedule = "0 8 * * 1"
playbook = "audit.md"
timeout = "40m"
