# ci-sweeper: a red default branch gets a finding, or a fix in a worktree and a pull request. docs/recipes.md.
name = "ci-sweeper"
summary = "When the default branch's checks go red, says so — or, at propose, reproduces the failure in a worktree, fixes it, and opens the pull request; twice failing to fix the same failure is a stop."
tier = "advanced"
useful_when = ["The default branch goes red and every open pull request looks red with it.", "The failures are the boring kind: a flaky assertion, a renamed fixture, a dependency that moved."]
needs_tracker = false
levels = ["report", "propose"]
needs = ["gh", "ci-workflows"]
needs_propose = ["git-remote"]
budget_hint_usd = 5

[[job]]
name = "ci-sweeper"
schedule = "*/15 * * * *"
playbook = "sweep.md"
timeout = "40m"
